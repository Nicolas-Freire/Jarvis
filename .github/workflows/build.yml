name: Build JARVIS APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar dependências
        run: npm install

      - name: Adicionar e configurar Android
        run: |
          npx cap add android || true
          mkdir -p android/app/src/main/assets
          cp www/index.html android/app/src/main/assets/ 2>/dev/null || true
          cat > android/app/src/main/assets/capacitor.plugins.json << 'PLUGINS'
          {}
          PLUGINS
          npx cap sync android || true

      - name: Dar permissão ao Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
